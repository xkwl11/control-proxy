version: '3.7'

services:
  control-proxy:
    build: .
    container_name: control-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./data:/data
      - /var/lib/zerotier-one/authtoken.secret:/secrets/authtoken.secret:ro
    environment:
      - SERVER_SECRET=change_this_long_random
      - NODE_ENV=production
